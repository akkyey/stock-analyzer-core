data:
  jp_stock_list: "data/input/jp_stock_list.csv"
  output_path: "data/output/analysis_result.csv"

filter:
  max_rsi: 100
  min_trading_value: 30000000

hard_filters:
  min_trading_value: 30000000

circuit_breaker:
  consecutive_failure_threshold: 5
  reset_timeout: 60

database:
  retention_days: 30

financial_repair:
  # 0.0 = 無効 (財務データは % 表記で保存される)。正の値にするとその値未満の自己資本比率を 100 倍する
  ratio_scaling_threshold: 0.0

sector_policies: {}

metadata_mapping: null

paths:
  db_file: "data/stock_master.db"
  output_dir: "data/output"

gdrive:
  enabled: true
  use_shared_drive: false

csv_mapping: 
  col_map: {}
  numeric_cols: []

notification:
  discord_webhook_url: ""

fetcher:
  skip_heavy_repair: true
  edinet_scan_days: 30
  # 同梱の財務シードを作り直したとき、既存の DB の古い財務値を更新する (シードごとに 1 回だけ。
  # 決算期の新しい値は変更しない)。Colab では Step 0 の「refresh_fundamentals」で切り替える
  refresh_fundamentals_from_seed: true

