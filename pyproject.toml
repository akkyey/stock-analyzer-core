[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "stock-analyzer4"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811", "F841"]
"notebook/*.ipynb" = ["E402", "E722", "F841"]
"*.ipynb" = ["E402", "E722", "F841"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "stock-analyzer4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [".git", "venv", ".venv", "env", "data", "stock-analyzer4", "archive"]
addopts = "-v --ignore=tests/integration_old --cov=src --cov-report=term-missing"
markers = [
    "integration: integration tests",
]
